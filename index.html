  });
}
function drawSummary(trip){
  const r=calc(trip),cur=trip.currency,c=cfg();
  const W=1080,H=2600,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  const INK="#13232f",MUT="#5b6a72",FAINT="#8d9aa0",LINE="#dbe2e1",ACC="#0e6b73",BG="#f3f6f5";
  const STACK="Aptos, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif";
  const F=(w,s,fam)=>w+" "+s+"px "+(fam||STACK);
  const DISPLAY="'Aptos Display', "+STACK;
  const M=56,cw=W-2*M;
  // header band
  x.save();rr(x,M,M,cw,330,40);x.clip();x.fillStyle=ACC;x.fillRect(M,M,cw,330);
  // faint route arc
  x.strokeStyle="rgba(255,255,255,.18)";x.lineWidth=3;x.setLineDash([10,12]);x.beginPath();x.moveTo(M+40,M+300);x.quadraticCurveTo(W/2,M+40,W-M-40,M+260);x.stroke();x.setLineDash([]);
  x.restore();
  x.fillStyle="rgba(255,255,255,.75)";x.font=F(700,22);x.textBaseline="alphabetic";
  spaced(x,"TRIP WALLET",M+56,M+78,4);
  x.textAlign="right";spaced(x,cur,W-M-56,M+78,4,true);x.textAlign="left";
  x.fillStyle="#fff";x.font=F(800,112);x.fillText(codeFor(trip),M+50,M+200);
  let fs=54;do{x.font="700 "+fs+"px "+DISPLAY;fs-=2;}while(fs>=38&&x.measureText(trip.name).width>cw-112);fitText(x,trip.name,M+56,M+272,cw-112);
  x.fillStyle="rgba(255,255,255,.8)";x.font=F(600,24);
  x.textAlign="right";x.fillText(fmtDate(trip.start)+" → "+fmtDate(trip.end,true)+" · "+r.days+" days",W-M-56,M+200);x.textAlign="left";
  // perforation
  const py=M+330;x.fillStyle=BG;x.beginPath();x.arc(M,py,26,0,Math.PI*2);x.arc(W-M,py,26,0,Math.PI*2);x.fill();
  x.strokeStyle=LINE;x.lineWidth=3;x.setLineDash([12,12]);x.beginPath();x.moveTo(M+40,py);x.lineTo(W-M-40,py);x.stroke();x.setLineDash([]);
  // totals
  let y=py+80;const L=M+56,Rr=W-M-56;
  x.fillStyle=FAINT;x.font=F(700,20);spaced(x,"TOTAL SPENT",L,y,3);
  y+=78;x.fillStyle=INK;x.font=F(800,84);x.fillText(fmt(r.total,cur),L-4,y);
  // status pill
  const stc={good:["#e2f3e2","#0a8f0a","On track"],warn:["#fdf1d6","#9a6600","Near limit"],crit:["#fbe4e4","#c23030","Over budget"],none:["#f0f3f3",MUT,"No cap set"]}[r.status];
  x.font=F(800,24);const pw=x.measureText(stc[2]).width+48;rr(x,Rr-pw,y-56,pw,52,26);x.fillStyle=stc[0];x.fill();x.fillStyle=stc[1];x.textAlign="center";x.fillText(stc[2],Rr-pw/2,y-21);x.textAlign="left";
  y+=46;x.fillStyle=MUT;x.font=F(500,26);
  x.fillText(r.budget?(Math.round(r.pct)+"% of "+fmt(r.budget,cur,{whole:true})+" cap · "+(r.left>=0?fmt(r.left,cur,{whole:true})+" left":fmt(-r.left,cur,{whole:true})+" over")):"No spending cap set",L,y);
  if(r.budget){y+=30;rr(x,L,y,Rr-L,18,9);x.fillStyle="#eef2f1";x.fill();const fw=Math.max(18,(Rr-L)*Math.min(1,r.pct/100));rr(x,L,y,fw,18,9);x.fillStyle=r.status==="crit"?"#d03b3b":r.status==="warn"?"#fab219":ACC;x.fill();
    const wx=L+(Rr-L)*r.warnAt/100;x.fillStyle="rgba(19,35,47,.35)";x.fillRect(wx-1.5,y-6,3,30);y+=18;}
  // donut + legend
  y+=70;
  const rows=[];Object.entries(r.byCat).forEach(([id,v])=>{const k=catById(id);const m=rows.find(z=>z.c.id===k.id);if(m)m.v+=v;else rows.push({c:k,v});});rows.sort((a,b)=>b.v-a.v);
  const shown=rows.slice(0,7);if(rows.length>7){shown.push({c:{name:"Others",icon:"",color:-1},v:rows.slice(7).reduce((s,z)=>s+z.v,0)});}
  const cx=L+150,cy=y+150,R=128;
  if(r.total>0){let a0=-Math.PI/2;shown.forEach(z=>{const a1=a0+z.v/r.total*Math.PI*2;x.beginPath();x.strokeStyle=z.c.color<0?"#b5bfc3":CAT_LIGHT[z.c.color%8];x.lineWidth=46;x.arc(cx,cy,R,a0+(shown.length>1?0.012:0),a1-(shown.length>1?0.012:0));x.stroke();a0=a1;});}
  else{x.beginPath();x.strokeStyle="#eef2f1";x.lineWidth=46;x.arc(cx,cy,R,0,Math.PI*2);x.stroke();}
  x.textAlign="center";x.fillStyle=FAINT;x.font=F(700,18);spaced(x,"EXPENSES",cx,cy-8,3,false,true);x.fillStyle=INK;x.font=F(800,40);x.fillText(String(r.exps.length),cx,cy+36);x.textAlign="left";
  let ly=y+18;const lx=L+340;
  shown.forEach(z=>{
    rr(x,lx,ly-20,22,22,6);x.fillStyle=z.c.color<0?"#b5bfc3":CAT_LIGHT[z.c.color%8];x.fill();
    x.fillStyle=INK;x.font=F(600,26);fitText(x,((z.c.icon?z.c.icon+" ":"")+z.c.name),lx+38,ly,Rr-lx-260);
    x.textAlign="right";x.font=F(800,26);x.fillText(fmt(z.v,cur,{whole:true}),Rr-80,ly);x.fillStyle=MUT;x.font=F(500,22);x.fillText(Math.round(z.v/(r.total||1)*100)+"%",Rr,ly);x.textAlign="left";
    ly+=42;
  });
  if(!shown.length){x.fillStyle=MUT;x.font=F(500,26);x.fillText("No expenses yet",lx,ly);}
  y=Math.max(cy+R+70,ly+20);
  // divider
  x.strokeStyle=LINE;x.lineWidth=2;x.beginPath();x.moveTo(L,y);x.lineTo(Rr,y);x.stroke();
  y+=56;
  // people
  const colW=(Rr-L)/2;
  PEOPLE_IDS.forEach((id,i)=>{
    const px=L+i*colW;
    x.beginPath();x.arc(px+28,y-10,28,0,Math.PI*2);x.fillStyle=id==="W"?"#0e6b73":"#6250d6";x.fill();
    x.fillStyle="#fff";x.font=F(800,26);x.textAlign="center";x.fillText(pinit(id),px+28,y-1);x.textAlign="left";
    x.fillStyle=MUT;x.font=F(600,22);fitText(x,pname(id)+" paid",px+72,y-18,colW-90);
    x.fillStyle=INK;x.font=F(800,32);x.fillText(fmt(r.paid[id],cur,{whole:true}),px+72,y+18);
  });
  y+=80;
  // settle
  const owe=r.net.W>0.005?{from:"P",to:"W",amt:r.net.W}:r.net.P>0.005?{from:"W",to:"P",amt:r.net.P}:null;
  rr(x,L,y,Rr-L,92,22);x.fillStyle="#eef5f5";x.fill();
  x.fillStyle=ACC;x.font=F(700,28);
  const txt=owe?(pname(owe.from)+" pays "+pname(owe.to)+" "+fmt(owe.amt,cur)):"All square, nobody owes anything";
  x.textAlign="center";fitText(x,txt,(L+Rr)/2,y+57,Rr-L-40,true);x.textAlign="left";
  // compose onto a card sized to the content (at least 4:5)
  const OH=Math.max(1350,Math.ceil(y+92+110+M));
  const out=document.createElement("canvas");out.width=W;out.height=OH;const o=out.getContext("2d");
  o.fillStyle=BG;o.fillRect(0,0,W,OH);rr(o,M,M,cw,OH-2*M,40);o.fillStyle="#fff";o.fill();
  o.drawImage(cv,0,0);
  o.fillStyle=FAINT;o.font=F(500,20);o.textAlign="center";
  o.fillText(c.people.W.name+" & "+c.people.P.name+" · made "+fmtDate(todayStr(),true),W/2,OH-M-40);
  return out;
}
/* ---------- share to Apple Notes ---------- */
const IS_APPLE=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
function summaryText(trip){
  const r=calc(trip),cur=trip.currency,L=[];
  const st={good:"On track",warn:"Near limit",crit:"Over budget",none:"No cap set"}[r.status];
  L.push("✈️ "+trip.name);
  L.push((trip.destination?trip.destination+" · ":"")+fmtDate(trip.start)+" → "+fmtDate(trip.end,true)+" ("+r.days+" day"+(r.days>1?"s":"")+")");
  L.push("");
  L.push("Spent: "+fmt(r.total,cur)+(r.budget?" of "+fmt(r.budget,cur,{whole:true})+" ("+Math.round(r.pct)+"%) · "+st:""));
  if(r.budget)L.push((r.left>=0?"Left: ":"Over by: ")+fmt(Math.abs(r.left),cur));
  L.push("");
  L.push("By category");
  const rows=[];Object.entries(r.byCat).forEach(([id,v])=>{const k=catById(id);const m=rows.find(z=>z.c.id===k.id);if(m)m.v+=v;else rows.push({c:k,v});});
  rows.sort((a,b)=>b.v-a.v).forEach(z=>L.push("• "+(z.c.icon?z.c.icon+" ":"")+z.c.name+": "+fmt(z.v,cur)+" ("+Math.round(z.v/(r.total||1)*100)+"%)"));
  L.push("");
  L.push("Who paid");
  PEOPLE_IDS.forEach(id=>L.push("• "+pname(id)+": "+fmt(r.paid[id],cur)+" (fair share "+fmt(r.share[id],cur)+")"));
  const owe=r.net.W>0.005?{from:"P",to:"W",amt:r.net.W}:r.net.P>0.005?{from:"W",to:"P",amt:r.net.P}:null;
  L.push("Settle up: "+(owe?pname(owe.from)+" pays "+pname(owe.to)+" "+fmt(owe.amt,cur):"All square"));
  L.push("");
  L.push("Expenses");
  tripExpenses(trip.id).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0)).forEach(e=>{
    if(e.kind==="transfer"){L.push("• "+fmtDate(e.date)+" · "+pname(e.from)+" paid back "+pname(e.to)+" · "+fmt(baseAmt(e),cur));return;}
    const c=catById(e.category);
    L.push("• "+fmtDate(e.date)+" · "+(e.title||c.name)+" · "+fmt(baseAmt(e),cur)+(e.currency&&e.currency!==cur?" ("+fmt(e.amount,e.currency)+")":"")+" · "+pname(e.paidBy)+" paid");
  });
  L.push("");
  L.push("Made with Trip Wallet · "+fmtDate(todayStr(),true));
  return L.join("\n");
}
async function shareSummary(trip,blob,fname){
  const text=summaryText(trip),title=trip.name+" · Trip Wallet";
  if(navigator.share&&!window.claude){
    try{
      let data={title,text};
      if(blob){const file=new File([blob],fname||"trip-summary.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[file],text}))data={title,text,files:[file]};}
      await navigator.share(data);return;
    }catch(err){if(err&&err.name==="AbortError")return;}
  }
  try{await navigator.clipboard.writeText(text);toast("Summary copied. Open Notes, start a new note and paste.","good",5000);return;}
  catch(e){}
  openSheet('<h2>Copy summary</h2><p class="hint" style="margin-bottom:10px">Select all, copy, then paste into a new note.</p><textarea id="sum-txt" readonly style="width:100%;min-height:320px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);font-size:14px">'+esc(text)+'</textarea><button class="btn block" data-dismiss style="margin-top:12px">Done</button>',sh=>{const ta=$("#sum-txt",sh);ta.focus();ta.select();});
}
function rr(x,X,Y,w,h,r){r=Math.min(r,h/2,w/2);x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function spaced(x,s,X,Y,sp,right,center){
  if("letterSpacing" in x){x.letterSpacing=sp+"px";x.fillText(s,X,Y);x.letterSpacing="0px";return;}
  x.fillText(s,X,Y);
}
function fitText(x,s,X,Y,max,center){
  s=String(s);if(x.measureText(s).width<=max){x.fillText(s,X,Y);return;}
  while(s.length>1&&x.measureText(s+"…").width>max)s=s.slice(0,-1);
  x.fillText(s+"…",X,Y);
}

function makeSample(today){
  const pdx=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
  const f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const t0=pdx(today);const start=new Date(t0);start.setDate(start.getDate()-3);const end=new Date(t0);end.setDate(end.getDate()+1);
  const day=n=>{const d=new Date(start);d.setDate(d.getDate()+n);return f(d);};
  const tripId="example-cnx";
  const trip={id:tripId,name:"Chiang Mai long weekend (example)",destination:"Chiang Mai",code:"CNX",start:f(start),end:f(end),currency:"THB",budget:18000,warnAt:80,catCaps:{food:4000},rates:{USD:33.5},createdAt:1,updatedAt:1};
  const E=[
    [0,"Flights BKK → CNX","transport",2780,"W","equal"],
    [0,"Old City guesthouse, 4 nights","stay",3600,"P","equal"],
    [0,"Khao soi at Mae Sai","food",180,"W","equal"],
    [0,"Grab from airport","transport",160,"P","equal"],
    [1,"Elephant sanctuary day trip","activity",65,"W","equal","USD"],
    [1,"Night bazaar dinner","food",620,"P","equal"],
    [1,"Silver earrings","shopping",850,"P","P"],
    [2,"Doi Suthep songthaew","transport",400,"W","equal"],
    [2,"Café hopping in Nimman","food",540,"W","equal"],
    [2,"Thai cooking class","activity",1800,"P","equal"],
    [3,"Sunday walking street snacks","food",460,"P","equal"],
    [3,"Massage at Lila","activity",1200,"W","custom",null,40],
    [3,"Hand-woven bag","shopping",690,"W","W"]
  ];
  const expenses=E.map((e,i)=>({id:"ex"+(i+1),tripId,kind:"expense",title:e[1],category:e[2],amount:e[3],currency:e[6]||"THB",rate:e[6]==="USD"?33.5:1,date:day(e[0]),paidBy:e[4],split:e[5],wPct:e[7]||50,note:"",createdAt:i+1,updatedAt:i+1,by:"W"}));
  expenses.push({id:"ex-pay1",tripId,kind:"transfer",from:"P",to:"W",amount:1000,currency:"THB",rate:1,date:day(2),note:"PromptPay",createdAt:20,updatedAt:20,by:"P"});

}
